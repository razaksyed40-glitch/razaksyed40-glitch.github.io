<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYED RAZAK | AI & Data Science</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f6;--grid:#dde3ee;--card:#fbfcfe;--ink:#101a33;--mute:#56607a;--line:#cfd6e4;--acc:#ff5a1f;--blue:#2457f5;--chip:#e6ebf4;--onacc:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--grid:#161f33;--card:#121a2c;--ink:#eef2fb;--mute:#97a3bd;--line:#26314d;--acc:#ff7a45;--blue:#7b98ff;--chip:#1b2540;--onacc:#0c1220}}
:root[data-theme="dark"]{--bg:#0c1220;--grid:#161f33;--card:#121a2c;--ink:#eef2fb;--mute:#97a3bd;--line:#26314d;--acc:#ff7a45;--blue:#7b98ff;--chip:#1b2540;--onacc:#0c1220}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:19px;line-height:1.65;min-height:100vh;
background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.disp{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.row span{font-size:16px;color:var(--mute)}
.row button{font:inherit;font-size:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.plate{display:flex;gap:6px;overflow-x:auto}
.plate button{flex:1;min-width:max-content;font:inherit;font-size:17px;padding:10px 8px;background:none;border:0;border-bottom:3px solid var(--line);color:var(--mute);cursor:pointer}
.plate button.done{border-color:var(--ink)}
.plate button.on{color:var(--ink);font-weight:700;border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:28px 20px 140px;position:relative}
.ghostx{position:absolute;right:6px;top:-6px;font-size:220px;line-height:1;font-weight:800;color:var(--ink);opacity:.06;pointer-events:none;user-select:none}
.kicker{font-size:14px;font-weight:700;color:var(--acc);margin:0 0 4px}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;margin:0 0 14px;letter-spacing:-.02em;position:relative}
h1{font-size:60px;line-height:1.02;letter-spacing:.01em}
h2{font-size:42px;line-height:1.1}
p{color:var(--mute);margin:0 0 14px;max-width:62ch;position:relative}
.sub{color:var(--blue);font-weight:700;font-size:23px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;position:relative}
.card h3{margin:0 0 10px;font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:17px}
.big{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;font-size:76px;line-height:1;color:var(--acc)}
dl{margin:0}dt{font-size:16px;font-weight:700;color:var(--mute);margin-top:14px}dt:first-child{margin-top:0}dd{margin:0}
.plot{cursor:pointer}.plot svg{width:100%;height:auto;display:block}.plot small{color:var(--mute);font-size:16px;display:block;margin-top:8px}.plot small b{color:var(--acc)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:6}
.btn{flex:1;font:inherit;font-weight:700;padding:16px 16px;font-size:18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-align:center}
.btn.p{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.3;cursor:default}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="row"><span id="count"></span><button id="theme">Theme</button></div>
  <div class="plate" id="plate"></div>
</header>
<main id="main"></main>
<div class="nav"><button class="btn" id="back">Back</button><button class="btn p" id="next">Next</button></div>

<script>
var S=[
{l:"Summary",h:function(){return '<h1>SYED<br>RAZAK</h1><p class="sub">AI &amp; Data Science graduate, Kadapa</p><p>I clean data, explore it and build machine learning models that answer real questions. I work with Python, SQL and Scikit-learn, and I am looking for an entry-level Data Analyst or Junior Data Scientist role.</p><div class="card plot" id="plot"><svg id="svg" viewBox="0 0 360 230" role="img" aria-label="Regression line fitting noisy data"></svg><small>A regression line fitting noisy data. Tap the plot to <b>generate new data</b>.</small></div>'},init:draw},
{l:"Education",h:function(){return '<h2>Education</h2><div class="card"><dl><dt>Degree</dt><dd>B.Tech, AI &amp; Data Science (2026), 70% aggregate</dd><dt>College</dt><dd>Kandula Obul Reddy Memorial College of Engineering, Kadapa</dd><dt>Certification</dt><dd>NPTEL Elite: Introduction to Internet of Things, IIT Kharagpur (2025)</dd><dt>Location</dt><dd>Kadapa, Andhra Pradesh, India</dd></dl></div><p>I like turning messy data into clear answers, and I learn best by building.</p>'}},
{l:"Experience",h:function(){return '<h2>AI internship</h2><div class="card"><div class="big">11</div><p style="margin:6px 0 0">weeks of AI internship, focused on detecting cyber attacks with machine learning.</p></div><div class="chips"><span>Python</span><span>Machine learning</span><span>Cyber security data</span></div>'}},
{l:"Skills",h:function(){return '<h2>Skills</h2><div class="card"><h3>Programming</h3><div class="chips"><span>Python</span><span>SQL</span><span>Data Structures and Algorithms</span></div></div><div class="card"><h3>Data analysis</h3><div class="chips"><span>Data cleaning</span><span>EDA</span><span>NumPy</span><span>Pandas</span><span>Matplotlib</span><span>Seaborn</span></div></div><div class="card"><h3>AI and machine learning</h3><div class="chips"><span>Scikit-learn</span><span>Machine learning</span><span>NLP</span><span>Generative AI</span></div></div><div class="card"><h3>Tools</h3><div class="chips"><span>Git</span><span>GitHub</span><span>Version control</span></div></div><div class="card"><h3>Learning now</h3><div class="chips"><span>Deep learning</span><span>RAG</span><span>Agentic AI</span></div></div>'}},
{l:"Projects",h:function(){return '<h2>Projects</h2><div class="card"><h3>Credit Score Predictor</h3><p style="margin:0 0 10px">Capstone project. A machine learning model that sorts bank applicants into risk groups.</p><div class="chips"><span>Python</span><span>Scikit-learn</span></div></div><div class="card"><h3>LLM-Powered Document Assistant</h3><p style="margin:0 0 10px">A document assistant that uses NLP and Generative AI.</p><div class="chips"><span>NLP</span><span>Generative AI</span></div></div><div class="card"><h3>Cyber Attack Detection</h3><p style="margin:0 0 10px">Built during my 11-week AI internship.</p><div class="chips"><span>Python</span><span>Machine learning</span></div></div>'}},
{l:"Contact",h:function(){return '<h2>Contact</h2><p>I am open to entry-level Data Analyst and Junior Data Scientist roles. Send me a message and I will reply soon.</p><div class="card"><dl><dt>Email</dt><dd><a href="mailto:razaksyed40@gmail.com">razaksyed40@gmail.com</a></dd><dt>Phone</dt><dd><a href="tel:+919391679495">+91 93916 79495</a></dd><dt>GitHub</dt><dd><a href="https://github.com/razaksyed40-glitch">github.com/razaksyed40-glitch</a></dd><dt>Location</dt><dd>Kadapa, Andhra Pradesh, India</dd></dl></div>'}}
];
var cur=0,plate=document.getElementById("plate"),main=document.getElementById("main"),btns=[];
S.forEach(function(s,i){
  var b=document.createElement("button");b.textContent=(i+1)+". "+s.l;b.onclick=function(){go(i)};plate.appendChild(b);btns.push(b);
});
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  btns.forEach(function(b,k){b.classList.toggle("on",k===cur);b.classList.toggle("done",k<cur)});
  main.innerHTML=S[cur].h();
  if(S[cur].init)S[cur].init();
  document.getElementById("count").textContent="Step "+(cur+1)+" of "+S.length;
  document.getElementById("back").disabled=cur===0;
  document.getElementById("next").textContent=cur===S.length-1?"Back to start":"Next: "+S[cur+1].l;
  btns[cur].scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo(0,0);
}
function draw(){
  var el=document.getElementById("svg");if(!el)return;
  var n=34,pts=[],sx=0,sy=0,sxy=0,sxx=0,i,x,y;
  for(i=0;i<n;i++){x=i/(n-1);y=0.1+0.8*x+(Math.random()-0.5)*0.28;pts.push([x,y]);sx+=x;sy+=y;sxy+=x*y;sxx+=x*x}
  var m=(n*sxy-sx*sy)/(n*sxx-sx*sx),c=(sy-m*sx)/n,W=360,H=230,p=16;
  var X=function(v){return p+v*(W-2*p)},Y=function(v){return H-p-v*(H-2*p)};
  var cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue("--ink").trim(),ac=cs.getPropertyValue("--acc").trim(),ln=cs.getPropertyValue("--line").trim(),s='';
  for(i=0;i<5;i++){var yy=p+i*(H-2*p)/4;s+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+ln+'"/>'}
  pts.forEach(function(q){s+='<circle cx="'+X(q[0]).toFixed(1)+'" cy="'+Y(Math.max(0,Math.min(1,q[1]))).toFixed(1)+'" r="3.2" fill="'+ink+'"/>'});
  s+='<line x1="'+X(0)+'" y1="'+Y(c)+'" x2="'+X(1)+'" y2="'+Y(m+c)+'" stroke="'+ac+'" stroke-width="3" stroke-linecap="round"/>';
  el.innerHTML=s;
  var pl=document.getElementById("plot");if(pl)pl.onclick=draw;
}
document.getElementById("next").onclick=function(){go(cur===S.length-1?0:cur+1)};
document.getElementById("back").onclick=function(){go(cur-1)};
document.getElementById("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";draw();
};
go(0);
</script>
</body>
</html>
